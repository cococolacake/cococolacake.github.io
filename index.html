<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hi, i'm coco!</title>
<meta name="description" content="hi, i'm coco! an illustrator studying to become an anthropologist, on computers since i was a kid.">
<meta name="theme-color" content="#160B22">
<link rel="icon" href="assets/heart.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" type="image/png">
<meta property="og:title" content="hi, i'm coco!">
<meta property="og:description" content="illustrator studying to become an anthropologist ♡">
<meta property="og:image" content="https://cococolacake.party/assets/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #160B22;
    --text: #F4EAF6;
    --soft: #EDDDF0;
    --muted: #C9B6D2;
    --pink: #FF5FB0;
    --pink-deep: #E0407F;
    --aqua: #3EF2DC;
    --lilac: #9B6BFF;
    --butter: #FFD54A;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --ease: cubic-bezier(.22, 1, .36, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; overflow-x: hidden; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 3px; }

  /* ---------- the lava lamp: soft blobs drifting behind the card ---------- */
  .lava { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(46px); opacity: 0; animation: fade-in 1.4s var(--ease) forwards; }
  .blob span { position: absolute; inset: 0; border-radius: 50%; background: inherit; }
  .b1 { width: 36vmax; height: 36vmax; right: -8vmax; top: -10vmax; background: var(--pink); --o: .72; }
  .b2 { width: 30vmax; height: 30vmax; left: -10vmax; top: 38vh; background: var(--pink-deep); --o: .7; animation-delay: .1s; }
  .b3 { width: 24vmax; height: 24vmax; left: 52vw; top: 66vh; background: var(--aqua); --o: .42; animation-delay: .2s; }
  .b4 { width: 20vmax; height: 20vmax; left: 16vw; top: 4vh; background: var(--lilac); --o: .5; animation-delay: .3s; }
  .b1 span { animation: lava1 19s ease-in-out infinite; }
  .b2 span { animation: lava2 23s ease-in-out infinite; }
  .b3 span { animation: lava3 27s ease-in-out infinite; }
  .b4 span { animation: lava4 21s ease-in-out infinite; }
  .blob { background: none; }
  .b1 span { background: var(--pink); } .b2 span { background: var(--pink-deep); }
  .b3 span { background: var(--aqua); } .b4 span { background: var(--lilac); }
  @keyframes fade-in { to { opacity: var(--o); } }
  @keyframes lava1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5vw, -14vh) scale(1.18); } }
  @keyframes lava2 { 0%, 100% { transform: translate(0, 0) scale(1.1); } 50% { transform: translate(-6vw, 12vh) scale(.9); } }
  @keyframes lava3 { 0%, 100% { transform: translate(0, 0) scale(.95); } 50% { transform: translate(-3vw, -18vh) scale(1.15); } }
  @keyframes lava4 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(7vw, 9vh) scale(1.2); } }

  /* ---------- the card ---------- */
  main { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; padding: 48px 20px; display: flex; align-items: center; justify-content: center; }
  .card {
    width: 100%; max-width: 560px; border-radius: 32px; overflow: hidden;
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 30px 80px -30px rgba(0, 0, 0, .6);
    -webkit-backdrop-filter: blur(26px) saturate(140%); backdrop-filter: blur(26px) saturate(140%);
  }
  .top { position: relative; padding: 40px 32px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .gh {
    position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
    color: #fff; text-decoration: none; transition: transform .3s var(--spring), background .2s;
  }
  .gh:hover { transform: translateY(-2px) rotate(-8deg) scale(1.06); background: rgba(255, 255, 255, .16); }
  .gh svg { width: 20px; height: 20px; }

  .avatar-wrap { position: relative; }
  .avatar {
    width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; padding: 0; border: 0; cursor: pointer;
    background: linear-gradient(160deg, var(--pink), var(--pink-deep)); box-shadow: 0 14px 34px -10px rgba(255, 95, 176, .75);
    transition: transform .35s var(--spring);
  }
  .avatar:hover { transform: rotate(-6deg) scale(1.05); }
  .avatar:active { transform: scale(.92); transition-duration: .1s; }
  .avatar svg { width: 56px; height: 37px; }
  .avatar.wiggle { animation: wiggle .5s var(--spring); }
  @keyframes wiggle { 30% { transform: rotate(-12deg) scale(1.08); } 60% { transform: rotate(8deg); } }
  .pronouns {
    position: absolute; right: -34px; bottom: -8px; padding: 4px 10px; border-radius: 99px;
    background: var(--aqua); color: #062A27; font-weight: 600; font-size: 13px; line-height: 1.2; white-space: nowrap;
    transform: rotate(-8deg); box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .5);
  }

  h1 { margin: 24px 0 0; font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1; letter-spacing: -.02em; color: #fff; }
  .bio { margin: 16px 0 0; max-width: 400px; font-size: 18px; line-height: 1.6; color: var(--soft); }
  .likes { margin: 28px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .likes li {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: rgba(255, 255, 255, .07); font-size: 15px;
    transition: transform .3s var(--spring), background .2s;
  }
  .likes li:hover { transform: translateY(-3px) rotate(-2deg); background: rgba(255, 255, 255, .12); }
  .likes i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .caption { margin: 10px 0 0; font-size: 13px; font-weight: 500; color: var(--muted); }

  .pit { position: relative; height: 168px; border-top: 1px solid rgba(255, 255, 255, .1); background: rgba(0, 0, 0, .14); }
  .pit canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; }
  .pit canvas:active { cursor: grabbing; }

  /* ---------- the load-in: one sequence, top to bottom ---------- */
  .in { opacity: 0; animation: rise .7s var(--ease) forwards; animation-delay: var(--d, 0s); }
  .card.in { animation-name: card-in; animation-duration: .9s; }
  .avatar-wrap.in { animation-name: pop; animation-timing-function: var(--spring); animation-duration: .6s; }
  .pronouns.in { animation-name: swing; animation-timing-function: var(--spring); animation-duration: .6s; }
  .gh.in { animation-name: fade; }
  @keyframes card-in { from { opacity: 0; transform: translateY(28px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-14deg); } to { opacity: 1; transform: none; } }
  @keyframes swing { from { opacity: 0; transform: rotate(-40deg) scale(.5); } to { opacity: 1; transform: rotate(-8deg); } }
  @keyframes fade { to { opacity: 1; } }

  @media (max-width: 520px) {
    main { padding: 24px 14px; }
    .top { padding: 36px 22px 28px; }
    h1 { font-size: 30px; }
    .bio { font-size: 17px; }
    .pit { height: 150px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; opacity: var(--o); }
    .blob span { animation: none; }
    .in, .card.in, .avatar-wrap.in, .pronouns.in, .gh.in { animation: none !important; opacity: 1; }
    .avatar, .gh, .likes li { transition: none; }
  }
</style>
</head>
<body>
  <div class="lava" aria-hidden="true">
    <div class="blob b1"><span></span></div>
    <div class="blob b2"><span></span></div>
    <div class="blob b3"><span></span></div>
    <div class="blob b4"><span></span></div>
  </div>

  <main>
    <div class="card in" style="--d: .15s">
      <div class="top">
        <a class="gh in" style="--d: .9s" href="https://github.com/cococolacake" aria-label="my github" title="my github">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        </a>

        <div class="avatar-wrap in" style="--d: .4s">
          <button class="avatar" type="button" aria-label="shake the ball pit">
            <svg viewBox="0 0 120 80" aria-hidden="true">
              <path fill="#3EF2DC" d="M30 32C18 18 4 22 6 33C0 37 6 48 16 44C12 52 24 56 30 46Z"/>
              <path fill="#3EF2DC" d="M90 32C102 18 116 22 114 33C120 37 114 48 104 44C108 52 96 56 90 46Z"/>
              <path fill="#FFFFFF" d="M60 70C32 52 24 38 24 28A17 17 0 0 1 60 21A17 17 0 0 1 96 28C96 38 88 52 60 70Z"/>
            </svg>
          </button>
          <span class="pronouns in" style="--d: .75s">she/he</span>
        </div>

        <h1 class="in" style="--d: .55s">hi, i'm coco!</h1>
        <p class="bio in" style="--d: .68s">i'm an illustrator studying to become an anthropologist! i've been on computers since i was a kid and i'm still just as passionate about them.</p>

        <ul class="likes" aria-label="my current obsessions">
          <li class="in" style="--d: .82s"><i aria-hidden="true" style="background: var(--pink)"></i>cute anime girls</li>
          <li class="in" style="--d: .9s"><i aria-hidden="true" style="background: var(--butter)"></i>guinea pigs</li>
          <li class="in" style="--d: .98s"><i aria-hidden="true" style="background: var(--aqua)"></i>mizi (alien stage)</li>
        </ul>
        <p class="caption in" style="--d: 1.08s" aria-hidden="true">my current obsessions</p>
      </div>

      <div class="pit" aria-hidden="true"><canvas></canvas></div>
    </div>
  </main>

<script>
// The ball pit: balls, hearts, stars and sprinkles. On load they rain in and pile up; they roll away
// from the mouse, burst when clicked, and the heart avatar shakes the whole pit.
(function () {
  var canvas = document.querySelector(".pit canvas");
  var ctx = canvas.getContext("2d");
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var colors = ["#FF5FB0", "#FF8AC8", "#3EF2DC", "#9B6BFF", "#FFD54A", "#FFFFFF", "#E0407F"];
  var kinds = ["ball", "ball", "ball", "heart", "star", "sprinkle"];
  var W = 0, H = 0, mouse = null, ps = [], toDrop = [], raf = null;

  function size() {
    var r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  size();

  var count = W < 420 ? 44 : 72;
  for (var i = 0; i < count; i++) {
    toDrop.push({ x: 12 + Math.random() * (W - 24), y: -20 - Math.random() * 40, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 2,
      r: 7 + Math.random() * 6, kind: kinds[i % kinds.length], color: colors[i % colors.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .2 });
  }

  // Position-based physics in fixed 60 Hz steps, so the pile settles instead of jittering.
  function step() {
    var i, j, k, p;
    for (i = 0; i < ps.length; i++) {
      p = ps[i]; p.px = p.x; p.py = p.y;
      p.vy += 0.22;
      if (mouse) {
        var dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 60 && d > 0.1) { var f = (60 - d) / 60 * 1.1; p.vx += dx / d * f; p.vy += dy / d * f; p.vr += (Math.random() - .5) * .15; }
      }
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vr *= 0.9;
    }
    for (k = 0; k < 5; k++) {
      for (i = 0; i < ps.length; i++) for (j = i + 1; j < ps.length; j++) {
        var a = ps[i], b = ps[j], ex = b.x - a.x, ey = b.y - a.y, dd = Math.hypot(ex, ey), m = a.r + b.r;
        if (dd >= m || dd < 0.01) continue;
        var nx = ex / dd, ny = ey / dd, o = (m - dd) / 2;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      }
      for (i = 0; i < ps.length; i++) {
        p = ps[i];
        if (p.y > H - p.r) p.y = H - p.r;
        if (p.x < p.r) p.x = p.r;
        if (p.x > W - p.r) p.x = W - p.r;
      }
    }
    for (i = 0; i < ps.length; i++) {
      p = ps[i];
      var floor = p.y >= H - p.r - 0.01;
      p.vx = (p.x - p.px) * (floor ? 0.9 : 0.985);
      p.vy = (p.y - p.py) * 0.985;
      if (Math.abs(p.vx) < 0.02) p.vx = 0;
      if (Math.abs(p.vy) < 0.02) p.vy = 0;
    }
  }

  function heart(r) { ctx.beginPath(); ctx.moveTo(0, r * .8); ctx.bezierCurveTo(-r * 1.3, 0, -r * .8, -r * 1.1, 0, -r * .35); ctx.bezierCurveTo(r * .8, -r * 1.1, r * 1.3, 0, 0, r * .8); ctx.fill(); }
  function star(r) { ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * .15, -r * .15, r, 0); ctx.quadraticCurveTo(r * .15, r * .15, 0, r); ctx.quadraticCurveTo(-r * .15, r * .15, -r, 0); ctx.quadraticCurveTo(-r * .15, -r * .15, 0, -r); ctx.fill(); }
  function pill(r) { var w = r * .5, h = r * 2, x = -w / 2, y = -r, c = w / 2; ctx.beginPath(); ctx.moveTo(x + c, y); ctx.arcTo(x + w, y, x + w, y + h, c); ctx.arcTo(x + w, y + h, x, y + h, c); ctx.arcTo(x, y + h, x, y, c); ctx.arcTo(x, y, x + w, y, c); ctx.fill(); }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      if (p.kind === "ball") {
        ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.arc(-p.r * .35, -p.r * .35, p.r * .3, 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === "heart") heart(p.r);
      else if (p.kind === "star") star(p.r * 1.1);
      else pill(p.r);
      ctx.restore();
    }
  }

  function burst(x, y, radius, power) {
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i], dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < radius) { var f = (radius - d) / radius * power; p.vx += dx / d * f; p.vy += dy / d * f - 3; p.vr += (Math.random() - .5) * .6; }
    }
  }

  function local(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") mouse = local(e); });
  canvas.addEventListener("pointerleave", function () { mouse = null; });
  canvas.addEventListener("pointerdown", function (e) { var q = local(e); burst(q.x, q.y, 120, 9); });

  var avatar = document.querySelector(".avatar");
  avatar.addEventListener("click", function () {
    avatar.classList.remove("wiggle"); void avatar.offsetWidth; avatar.classList.add("wiggle");
    for (var i = 0; i < ps.length; i++) { ps[i].vy -= 4 + Math.random() * 5; ps[i].vx += (Math.random() - .5) * 6; ps[i].vr += (Math.random() - .5) * .8; }
  });

  if (window.ResizeObserver) new ResizeObserver(function () {
    var oldW = W; size();
    if (oldW && W !== oldW) for (var i = 0; i < ps.length; i++) ps[i].x *= W / oldW;
    if (!raf) draw();
  }).observe(canvas);

  if (still) {   // reduced motion: start with the pile already settled, and only move when poked
    ps = toDrop; toDrop = [];
    for (var s = 0; s < ps.length; s++) ps[s].y = H * .4 + Math.random() * H * .5;
    for (var t = 0; t < 600; t++) step();
  }

  var last = performance.now(), acc = 0, started = performance.now(), dropDelay = still ? 0 : 1100;
  function loop(now) {
    acc = Math.min(acc + (now - last), 100); last = now;
    // the rain: after the text has come in, drop a piece every 28 ms
    if (toDrop.length && now - started > dropDelay) {
      var due = Math.floor((now - started - dropDelay) / 28) - (count - toDrop.length) + 1;
      while (due-- > 0 && toDrop.length) ps.push(toDrop.shift());
    }
    while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
    draw();
    raf = requestAnimationFrame(loop);
  }
  // pause when the tab is hidden
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { cancelAnimationFrame(raf); raf = null; }
    else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
  });
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
